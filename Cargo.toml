[package]
name = "df-regexp-extract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Avi Fenesh aviarchi1994@gmail.com"]
description = "DataFusion Scalar UDF: Spark-compatible regexp_extract (no SQL API)."
autobins = false
autobenches = false

[lib]
name = "df_regexp_extract"
path = "src/lib.rs"

[[bin]]
name = "generate_csv_data"
path = "src/bin/generate_csv_data.rs"
test = false
bench = false

[dependencies]
datafusion = { version = "50.1", default-features = false, features = ["regex_expressions", "unicode_expressions"] }
regex = "1.10"
lru = "0.16"
pcre2 = { version = "0.2", optional = true }

[features]
default = ["pcre2-fallback"]
pcre2-fallback = ["pcre2"]

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "macros"] }

[[bench]]
name = "benchmarks"
harness = false

# Release profile: maximum optimization
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Bench profile: fast iteration, decent optimization
[profile.bench]
inherits = "release"
strip = false
debug = 1
